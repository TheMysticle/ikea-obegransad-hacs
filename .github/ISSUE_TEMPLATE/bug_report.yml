name: Bug Report
description: Report a problem with the integration
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for taking the time to fill out a bug report!
  - type: input
    id: ha_version
    attributes:
      label: Home Assistant Version
      placeholder: "e.g. 2024.6.0"
    validations:
      required: true
  - type: input
    id: integration_version
    attributes:
      label: Integration Version
      placeholder: "e.g. 1.0.0"
    validations:
      required: true
  - type: input
    id: firmware
    attributes:
      label: Lamp Firmware Version
      placeholder: "from /api/info response"
  - type: textarea
    id: description
    attributes:
      label: Describe the bug
      description: A clear and concise description of what is happening.
    validations:
      required: true
  - type: textarea
    id: logs
    attributes:
      label: Relevant log output
      description: Paste any relevant logs from Settings → System → Logs
      render: shell
